services:
  backend:
    image: ${BACKEND_IMAGE:-codewithharshal/devops-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >-
      sh -c "python manage.py migrate --noinput &&
      exec gunicorn --bind 0.0.0.0:8000 --workers 2 config.wsgi:application"
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/api/hello/', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ${FRONTEND_IMAGE:-codewithharshal/devops-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy
